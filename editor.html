<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCollab — Editor</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div id="stars"></div>
  <div class="glow-overlay"></div>

  <nav class="navbar">
    <div class="nav-brand">
      <span class="logo">&lt;/&gt;</span>
      <span class="brand-name">CodeCollab</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="editor.html" class="active">Editor</a></li>
      <li><a href="chat.html">Chat</a></li>
    </ul>
  </nav>

  <div class="editor-layout">
    <!-- File Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>Explorer</h3>
        <button class="btn-icon" id="newFileBtn" title="New File">+</button>
      </div>
      <ul class="file-tree" id="fileTree">
        <li class="file-item active" data-file="index.js">
          <span class="file-icon">&#128196;</span> index.js
        </li>
        <li class="file-item" data-file="styles.css">
          <span class="file-icon">&#127912;</span> styles.css
        </li>
        <li class="file-item" data-file="readme.md">
          <span class="file-icon">&#128214;</span> readme.md
        </li>
      </ul>
    </aside>

    <!-- Editor Main -->
    <main class="editor-main">
      <div class="editor-tabs">
        <div class="tab active" data-file="index.js">
          index.js <span class="tab-close">&times;</span>
        </div>
      </div>

      <div class="code-area">
        <pre class="line-numbers" id="lineNumbers">1</pre>
        <textarea
          class="code-editor"
          id="codeEditor"
          spellcheck="false"
          placeholder="Start typing your code..."
        >// Welcome to CodeCollab!
// Start coding below...

function greet(name) {
  return `Hello, ${name}! Welcome to CodeCollab.`;
}

const team = ["Alice", "Bob", "Charlie"];

team.forEach(member => {
  console.log(greet(member));
});

// Happy coding!</textarea>
      </div>

      <div class="status-bar">
        <span id="cursorPos">Ln 1, Col 1</span>
        <span>JavaScript &bull; UTF-8</span>
      </div>
    </main>

    <!-- Mini Chat -->
    <aside class="mini-chat">
      <div class="mini-chat-header">
        &#128172; Team Chat
      </div>
      <div class="mini-chat-messages" id="miniChatMessages">
        <div class="mini-msg">
          <strong class="msg-user" style="color: #ec4899;">Alice:</strong>
          <span>Just pushed the navbar fix!</span>
        </div>
        <div class="mini-msg">
          <strong class="msg-user" style="color: #f59e0b;">Bob:</strong>
          <span>Nice, I'll review it now.</span>
        </div>
      </div>
      <div class="mini-chat-input">
        <input type="text" id="miniChatInput" placeholder="Say something..." />
        <button class="btn-icon" id="miniChatSend">&#10148;</button>
      </div>
    </aside>
  </div>

  <script src="js/stars.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
